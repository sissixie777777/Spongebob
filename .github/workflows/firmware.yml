name: Firmware validation
on: [push, pull_request]
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the shared control core
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/controller_test.cpp -o /tmp/controller_test && /tmp/controller_test
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [nano, nano_new_bootloader, nano_demo, xiao, xiao_demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.environment }}
