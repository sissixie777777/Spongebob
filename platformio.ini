[platformio]
default_envs = nano
src_dir = firmware

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:nano]
platform = atmelavr@5.1.0
board = nanoatmega328
lib_deps = arduino-libraries/Servo@1.2.2

[env:nano_new_bootloader]
extends = env:nano
board = nanoatmega328new

[env:nano_demo]
extends = env:nano
build_flags = ${env.build_flags} -DSPONGE_DEMO=1

[env:xiao]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DSPONGE_XIAO=1

[env:xiao_demo]
extends = env:xiao
build_flags = ${env:xiao.build_flags} -DSPONGE_DEMO=1
